spring:
  application:
    name: room-booking
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  jpa:
    open-in-view: false
    show-sql: true
    hibernate:
      ddl-auto: create
  data:
    web:
      pageable:
        max-page-size: 100

jwt:
  secret: ${JWT_SECRET}